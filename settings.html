<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Manga/Novel Tracker Settings</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      body {
        max-width: 650px;
        margin: 40px auto;
        background: #101522;
        color: #edf2ff;
        padding: 0 20px;
      }
      fieldset {
        border: 1px solid #41557d;
        border-radius: 10px;
        margin: 16px 0;
        padding: 16px;
      }
      label {
        display: block;
        margin: 12px 0;
      }
      button,
      input {
        background: #172238;
        color: #edf2ff;
        border: 1px solid #41557d;
        border-radius: 7px;
        padding: 8px;
      }
      .hint {
        color: #a9b9d8;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>Tracker settings</h1>
    <p class="hint">
      Data stays in this browser. Tracking runs only on the five supported sources after you enable it.
    </p>
    <fieldset>
      <legend>Consent and tracking</legend>
      <label
        ><input id="consent" type="checkbox" /> I understand the extension reads supported chapter pages to
        save my progress locally.</label
      ><label><input id="tracking" type="checkbox" /> Automatically track supported chapters</label>
    </fieldset>
    <fieldset>
      <legend>Release checks</legend>
      <label><input id="refresh" type="checkbox" /> Check tracked series daily</label
      ><label>Local check hour <input id="hour" type="number" min="0" max="23" /></label
      ><label><input id="notifications" type="checkbox" /> Show desktop notifications for new chapters</label>
    </fieldset>
    <button id="save">Save settings</button><span id="status" class="hint" role="status"></span>
    <script src="dist/settings.js"></script>
  </body>
</html>
