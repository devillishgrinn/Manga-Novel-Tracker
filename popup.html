<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Manga/Novel Tracker</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 360px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f0f0f;
            color: #f5f5f5;
        }

        header {
            background: #1f1f1f;
            padding: 12px 16px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 16px;
            margin: 0;
            font-weight: 600;
            color: #fff;
        }

        #list {
            padding: 12px;
            max-height: 440px;
            overflow-y: auto;
        }

        .site-section {
            margin-bottom: 14px;
        }

        .site-banner {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            margin-bottom: 8px;
            border: 1px solid #2f3644;
            border-radius: 10px;
            background: linear-gradient(90deg, #1b2230 0%, #171717 100%);
        }

        .site-logo {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            background: #2b3750;
            color: #dce8ff;
            border: 1px solid #4a5d85;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
        }

        .site-logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        .site-logo-fallback {
            width: 100%;
            height: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .site-banner-copy {
            display: flex;
            align-items: baseline;
            gap: 8px;
            min-width: 0;
        }

        .site-banner-name {
            font-size: 13px;
            font-weight: 600;
            color: #dfe7ff;
        }

        .site-banner-count {
            font-size: 10px;
            color: #8da2cc;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .site-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .entry {
            background: #1a1a1a;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #2a2a2a;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
        }

        .cover-wrapper {
            flex-shrink: 0;
            width: 45px;
            height: 65px;
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #333;
        }

        .entry:hover {
            background: #222;
            border-color: #444;
        }

        .info {
            flex-grow: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .title {
            font-weight: 600;
            font-size: 14px;
            color: #4da6ff;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .title:hover {
            text-decoration: underline;
        }

        .meta {
            font-size: 11px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .chapter-controls {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .chapter-controls button {
            padding: 2px 6px;
            min-width: 20px;
            line-height: 1;
            font-size: 12px;
        }

        .chapter-value {
            color: #bbb;
        }

        .linked-tag {
            font-size: 10px;
            color: #9aa0a8;
            background: #262a31;
            border: 1px solid #343a44;
            border-radius: 10px;
            padding: 2px 6px;
        }

        .badge {
            background: #333;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            font-size: 9px;
            letter-spacing: 0.5px;
        }

        .entry.entry-manga .badge {
            background: #3a2a1b;
            color: #ffd6a8;
        }

        .entry.entry-novel .badge {
            background: #1f3430;
            color: #b9efe4;
        }

        .actions {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        button {
            background: #2a2a2a;
            border: none;
            color: #ccc;
            cursor: pointer;
            padding: 6px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        button:hover {
            background: #3a3a3a;
            color: #fff;
        }

        button.delete:hover {
            background: #4a1a1a;
            color: #ff6b6b;
        }

        .empty {
            color: #666;
            text-align: center;
            margin-top: 40px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Reading List</h1>
        <span style="font-size: 11px; color: #666;">v0.1.0</span>
    </header>
    <div id="list"></div>
    <script src="dist/popup.js"></script>
</body>
</html>
