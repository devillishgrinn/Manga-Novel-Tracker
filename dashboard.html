<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manga/Novel Tracker Library</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        background: #101522;
        color: #edf2ff;
      }
      header,
      main {
        max-width: 1080px;
        margin: auto;
        padding: 18px 24px;
      }
      header {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        border-bottom: 1px solid #29334b;
      }
      h1 {
        margin: 0 auto 0 0;
        font-size: 20px;
      }
      input,
      select,
      button {
        background: #172238;
        color: #edf2ff;
        border: 1px solid #41557d;
        border-radius: 7px;
        padding: 8px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        background: #30466f;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .view-tabs {
        display: flex;
        gap: 8px;
        max-width: 1080px;
        margin: 0 auto;
        padding: 12px 24px 0;
      }
      .view-tab {
        background: transparent;
        border: 1px solid #41557d;
        border-bottom: none;
        border-radius: 7px 7px 0 0;
        padding: 8px 14px;
      }
      .view-tab[aria-selected="true"] {
        background: #172238;
        border-color: #51688f;
      }
      #list {
        display: grid;
        gap: 10px;
      }
      .card {
        display: grid;
        grid-template-columns: 64px 1fr auto;
        gap: 14px;
        align-items: center;
        border: 1px solid #293b5b;
        background: #141c2c;
        border-radius: 10px;
        padding: 12px;
      }
      .cover {
        width: 56px;
        height: 76px;
        object-fit: cover;
        background: #273652;
        border-radius: 6px;
      }
      .title {
        margin: 0 0 5px;
        font-size: 16px;
      }
      .meta {
        color: #a9b9d8;
        font-size: 13px;
        margin: 3px 0;
      }
      .card-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: flex-end;
      }
      .empty {
        color: #a9b9d8;
        text-align: center;
        padding: 48px;
      }
      dialog {
        background: #172238;
        color: #edf2ff;
        border: 1px solid #51688f;
        border-radius: 10px;
        max-width: 520px;
      }
      dialog div {
        display: grid;
        gap: 8px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      #backup {
        display: none;
      }
      .health-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .health-header h2 {
        margin: 0;
        font-size: 18px;
      }
      .health-table {
        width: 100%;
        border-collapse: collapse;
      }
      .health-table th,
      .health-table td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid #29334b;
        font-size: 14px;
      }
      .health-table th {
        color: #a9b9d8;
        font-weight: 600;
      }
      .health-table tr:last-child td {
        border-bottom: none;
      }
      .status-badge {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        text-transform: capitalize;
      }
      .status-badge.healthy {
        background: #1f3d2a;
        color: #8fe0a8;
      }
      .status-badge.warning {
        background: #3d341f;
        color: #f0d48f;
      }
      .status-badge.broken {
        background: #3d1f1f;
        color: #f08f8f;
      }
      .status-badge.unknown {
        background: #273652;
        color: #a9b9d8;
      }
      .health-error {
        max-width: 280px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #f08f8f;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Library</h1>
    </header>
    <nav class="view-tabs" role="tablist" aria-label="Library views">
      <button id="tabSeries" class="view-tab" role="tab" aria-selected="true" aria-controls="libraryPanel">
        Series
      </button>
      <button id="tabHealth" class="view-tab" role="tab" aria-selected="false" aria-controls="healthPanel">
        Source Health
      </button>
    </nav>
    <main>
      <section id="libraryPanel" role="tabpanel" aria-labelledby="tabSeries">
        <div class="toolbar">
          <input id="search" type="search" placeholder="Search series" aria-label="Search series" />
          <select id="media" aria-label="Media filter">
            <option value="all">All media</option>
            <option value="manga">Manga</option>
            <option value="novel">Novels</option>
          </select>
          <button id="refresh">Refresh releases</button><button id="export">Export</button
          ><button id="import">Import</button><input id="backup" type="file" accept="application/json" />
        </div>
        <section id="list" aria-live="polite"></section>
      </section>
      <section id="healthPanel" role="tabpanel" aria-labelledby="tabHealth" hidden>
        <div class="health-header">
          <h2>Source Health</h2>
          <button id="checkHealth">Check sources</button>
        </div>
        <div id="healthList" aria-live="polite"></div>
      </section>
    </main>
    <dialog id="linkDialog">
      <form method="dialog">
        <div>
          <strong>Link source</strong
          ><label
            >Source
            <select id="sourceChoice"></select
          ></label>
          <p id="linkCopy" class="meta"></p>
          <menu>
            <button value="cancel">Cancel</button><button id="confirmLink" value="default">Link</button>
          </menu>
        </div>
      </form>
    </dialog>
    <script src="dist/dashboard.js"></script>
  </body>
</html>
